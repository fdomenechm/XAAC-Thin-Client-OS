schema_version: 1
audit:
  required_fields:
    - session_id
    - operator
    - device_id
    - reason
    - started_at
  allowed_end_statuses:
    - completed
    - cancelled
    - expired
    - failed
  clock: utc
  duration_unit: seconds
  append_only: true
outputs:
  journal: /var/log/xaac/rustdesk-sessions.jsonl
  active_session: /run/xaac/rustdesk/audit-active-session.json
  state: /var/lib/xaac-agent/services/rustdesk-audit.json
