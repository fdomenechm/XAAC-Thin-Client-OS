schema: gpt
disk_size_mib: 7168
alignment_mib: 1
partitions:
  - name: efi
    number: 1
    size_mib: 256
    type_code: "EF00"
    filesystem: vfat
    label: XAAC_EFI
    mountpoint: /boot/efi
    options: umask=0077
  - name: root
    number: 2
    size_mib: 4608
    type_code: "8304"
    filesystem: ext4
    label: XAAC_ROOT
    mountpoint: /
    options: defaults,noatime
  - name: persistent
    number: 3
    size_mib: 1536
    type_code: "8300"
    filesystem: ext4
    label: XAAC_DATA
    mountpoint: /var/lib/xaac
    options: defaults,noatime
  - name: recovery
    number: 4
    size_mib: 700
    type_code: "8300"
    filesystem: ext4
    label: XAAC_RECOVERY
    mountpoint: /recovery
    options: defaults,noatime,nofail
