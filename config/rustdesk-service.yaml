schema_version: 1
service:
  name: rustdesk-xaac.service
  description: XAAC Remote Support service
  user: xaac-rustdesk
  group: xaac-rustdesk
  executable: /usr/bin/rustdesk-xaac
  arguments:
    - --service
    - --config
    - /etc/xaac/rustdesk/managed-config.json
  restart: on-failure
  restart_sec: 5
  start_limit_interval_sec: 60
  start_limit_burst: 5
  timeout_stop_sec: 20
dependencies:
  after:
    - network-online.target
  wants:
    - network-online.target
  requires_paths:
    - /usr/bin/rustdesk-xaac
    - /etc/xaac/rustdesk/managed-config.json
sandbox:
  no_new_privileges: true
  private_tmp: true
  protect_system: strict
  protect_home: true
  protect_kernel_tunables: true
  protect_kernel_modules: true
  protect_control_groups: true
  restrict_suid_sgid: true
  lock_personality: true
  memory_deny_write_execute: false
  capability_bounding_set: []
  read_write_paths:
    - /var/lib/xaac/rustdesk
    - /run/xaac/rustdesk
outputs:
  unit: /etc/systemd/system/rustdesk-xaac.service
  sysusers: /usr/lib/sysusers.d/xaac-rustdesk.conf
  tmpfiles: /usr/lib/tmpfiles.d/xaac-rustdesk.conf
  state: /var/lib/xaac-agent/services/rustdesk.json
