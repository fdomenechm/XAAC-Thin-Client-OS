schema_version: 1
product: XAAC Thin Client OS
version: 1.0.0
status: stable
channel: production
artifacts:
  iso: .build/iso/xaac-thin-client-os-1.0.0.iso
  img: .build/img/xaac-thin-client-os-1.0.0.img.xz
  recovery_img: .build/recovery/xaac-thin-client-os-recovery-1.0.0.img.xz
  pxe: .build/pxe/xaac-thin-client-os-1.0.0
  packages: .build/packaging/repository
  documentation: docs/manual
security:
  hash_algorithm: sha256
  detached_signatures: true
  signing_key_env: XAAC_SIGNING_KEY
approval:
  rc_status_file: .build/release-candidate/approval.json
outputs:
  manifest: .build/final-release/manifest.json
  notes: .build/final-release/RELEASE_NOTES.md
  announcement: .build/final-release/ANNOUNCEMENT.md
  release_script: .build/final-release/publish-release.sh
  verify_script: .build/final-release/verify-release.sh
