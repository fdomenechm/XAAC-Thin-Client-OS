schema_version: 1
product: XAAC Thin Client OS
version: 1.0.0-rc.1
freeze:
  enabled: true
  allowed_changes:
    - critical-fix
    - security-fix
    - proven-regression
    - required-documentation
  forbidden_changes:
    - new-feature
    - architecture-change
    - dependency-upgrade-without-approval
gates:
  unit_tests: python -m pytest -q
  image_tests: python -m pytest -q tests/test_image_test_suite.py
  hardware_tests: python -m pytest -q tests/test_hardware_final_tests.py
  performance_tests: python -m pytest -q tests/test_performance_stability.py
  documentation: python -m pytest -q tests/test_documentation.py
  packaging: python -m pytest -q tests/test_production_packaging.py
artifacts:
  iso: .build/iso/xaac-thin-client-os-1.0.0-rc.1.iso
  img: .build/img/xaac-thin-client-os-1.0.0-rc.1.img.xz
  pxe: .build/pxe/xaac-thin-client-os-1.0.0-rc.1
  packages: .build/packaging/repository
approval:
  required: true
  roles:
    - release-manager
    - security-reviewer
outputs:
  manifest: .build/release-candidate/manifest.json
  notes: .build/release-candidate/RELEASE_NOTES.md
  approval: .build/release-candidate/approval.json
  verify_script: .build/release-candidate/verify-rc.sh
